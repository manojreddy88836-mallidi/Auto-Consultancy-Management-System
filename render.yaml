services:
  - type: web
    name: auto-consultancy-backend
    runtime: java
    # Build: Render runs this from the repo root
    buildCommand: cd backend && mvn clean package -DskipTests -q --no-transfer-progress
    # Start: runs from repo root; JAR is at backend/target/
    # -Djava.security.egd speeds up SecureRandom on Linux (Render uses Linux)
    # -XX:+UseContainerSupport: JVM respects container memory limits
    # -XX:MaxRAMPercentage=70.0: use 70% of Render's 512MB = ~358MB heap
    startCommand: java -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -Djava.security.egd=file:/dev/./urandom -jar backend/target/backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/health
    # Render health check: pings /api/health every 30s to verify app is live
    # This endpoint returns {"status":"UP"} with no DB call (< 1ms response)
    envVars:
      - key: JAVA_VERSION
        value: "25"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0"
      # Set ALL of these in Render Dashboard → Environment tab:
      # MONGO_URI            → mongodb+srv://user:pass@cluster.mongodb.net/shop_management?retryWrites=true&w=majority
      # JWT_SECRET           → 64+ char random string
      # MAIL_PASSWORD        → Gmail App Password (16 chars, no spaces)
      # SEED_ADMIN_PASSWORD  → Admin login password
      # ADMIN_EMAILS         → venkatamanojreddymallidi@gmail.com,ganeshautoconsultancy358@gmail.com
      # CORS_ALLOWED_ORIGINS → https://your-frontend-service.onrender.com
