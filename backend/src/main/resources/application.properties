# ── MongoDB ──────────────────────────────────────────────────────────────────
# Render env var: MONGO_URI  (also accepts MONGODB_URI for legacy compat)
spring.data.mongodb.uri=${MONGO_URI:${MONGODB_URI:mongodb://localhost:27017/shop_management}}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.uuid-representation=standard


# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_USE_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARS_DO_NOT_USE_THIS_DEFAULT}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# ── Server ────────────────────────────────────────────────────────────────────
# Render injects the PORT env var — MUST use ${PORT:...} for port detection
server.port=${PORT:10000}
# Bind to all interfaces so Render's load balancer can reach the app
server.address=0.0.0.0

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Actuator / health ────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ── Gmail SMTP (OTP delivery) ─────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:venkatamanojreddymallidi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:CONFIGURE_ME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Admin OTP configuration ───────────────────────────────────────────────────
admin.emails=${ADMIN_EMAILS:venkatamanojreddymallidi@gmail.com,ganeshautoconsultancy358@gmail.com}
admin.otp.expiry-minutes=5
admin.otp.max-attempts=5
admin.otp.resend-cooldown-seconds=60

# ── HTTP Compression (gzip) ───────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css,text/plain,text/xml
server.compression.min-response-size=1024

# ── Tomcat connection tuning ──────────────────────────────────────────────────
# Reduced for Render free tier (0.5 vCPU, 512 MB RAM)
server.tomcat.max-threads=30
server.tomcat.min-spare-threads=3
server.tomcat.accept-count=50
server.tomcat.connection-timeout=20000

# ── Spring Boot startup optimization ─────────────────────────────────────────
# Lazy init speeds up startup by initializing beans on first use
spring.main.lazy-initialization=true
# Background metadata refresh (reduces startup I/O wait)
spring.jmx.enabled=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.autoconsultancy=INFO
logging.level.org.springframework.data.mongodb=WARN
# Suppress Mongo driver verbose cluster heartbeat logs on Render
logging.level.org.mongodb.driver.cluster=WARN
logging.level.org.mongodb.driver.connection=WARN
logging.level.org.springframework.boot.context.config=WARN
