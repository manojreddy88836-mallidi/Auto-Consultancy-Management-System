# ── MongoDB ──────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shop_management}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.uuid-representation=standard

# ── JWT ──────────────────────────────────────────────────────────────────────
# IMPORTANT: Set JWT_SECRET env-var to a strong random 64-char+ string in production
jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_USE_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARS_DO_NOT_USE_THIS_DEFAULT}
# Access token lifetime: 1 hour (3 600 000 ms) — rotate with refresh token in production
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Actuator / health (disabled by default for security) ─────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Gmail SMTP (OTP delivery) ─────────────────────────────────────────────────
# Set MAIL_PASSWORD to a Gmail App Password (not your Gmail account password)
# Generate at: https://myaccount.google.com/apppasswords
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:venkatamanojreddymallidi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:CONFIGURE_ME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Admin OTP configuration ───────────────────────────────────────────────────
# Comma-separated list of authorized admin emails (no spaces around commas)
admin.emails=${ADMIN_EMAILS:venkatamanojreddymallidi@gmail.com,ganeshautoconsultancy358@gmail.com}
admin.otp.expiry-minutes=5
admin.otp.max-attempts=5
admin.otp.resend-cooldown-seconds=60

# ── HTTP Compression (gzip) ───────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css,text/plain,text/xml
server.compression.min-response-size=1024

# ── Tomcat connection tuning ──────────────────────────────────────────────────
server.tomcat.max-threads=50
server.tomcat.min-spare-threads=5
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# ── MongoDB connection pool ───────────────────────────────────────────────────

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoint.health.probes.enabled=true

# ── Logging: never log HTTP request bodies or sensitive params ────────────────
logging.level.org.springframework.security=WARN
logging.level.com.autoconsultancy=INFO
logging.level.org.springframework.data.mongodb=WARN
