version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: auto_consultancy_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auto_consultancy
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: acuser
      MYSQL_PASSWORD: acpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - autoconsultancy-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auto_consultancy_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auto_consultancy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: acuser
      SPRING_DATASOURCE_PASSWORD: acpassword
      JWT_SECRET: auto_consultancy_docker_secret_key_change_in_production
      JWT_EXPIRATION: 86400000
      FILE_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:3000
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - autoconsultancy-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (Production build served with nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auto_consultancy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - autoconsultancy-net

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  autoconsultancy-net:
    driver: bridge
